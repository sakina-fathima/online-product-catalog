<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise Product Catalog & Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-slate-50 font-sans antialiased">
    <!-- Top Navigation -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
      <div
        class="container mx-auto px-6 py-4 flex justify-between items-center"
      >
        <div class="flex items-center space-x-3">
          <div class="bg-indigo-600 p-2 rounded-lg text-white">
            <i class="fa-solid fa-boxes-stacked text-xl"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold tracking-wide">CatalogX</h1>
            <p class="text-xs text-slate-400">Big Data E-Commerce Engine</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <button
            onclick="openModal()"
            class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm flex items-center space-x-2"
          >
            <i class="fa-solid fa-plus"></i>
            <span>Add Product</span>
          </button>
          <button
            onclick="fetchAnalytics()"
            class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm flex items-center space-x-2"
          >
            <i class="fa-solid fa-chart-pie"></i>
            <span>Analytics</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-6 py-8">
      <!-- Search, Filter & Sort Bar -->
      <div
        class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row gap-4 items-center"
      >
        <div class="relative flex-1 w-full">
          <span
            class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400"
          >
            <i class="fa-solid fa-magnifying-glass"></i>
          </span>
          <input
            type="text"
            id="searchInput"
            placeholder="Search by keyword (e.g., apple, laptop, flagship)..."
            class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
          />
        </div>

        <!-- Category Filter Dropdown -->
        <select
          id="categoryFilter"
          onchange="loadProducts()"
          class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
          <option value="All">All Categories</option>
          <option value="Electronics">Electronics</option>
          <option value="Sports">Sports & Footwear</option>
          <option value="Gaming">Gaming</option>
          <option value="Home">Home Appliances</option>
        </select>

        <!-- Price Sort Dropdown -->
        <select
          id="sortFilter"
          onchange="loadProducts()"
          class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
          <option value="default">Sort by Price</option>
          <option value="low-high">Price: Low to High</option>
          <option value="high-low">Price: High to Low</option>
        </select>

        <button
          onclick="searchProducts()"
          class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg text-sm font-medium transition shadow-sm"
        >
          Search
        </button>
      </div>

      <!-- Analytics Output Box -->
      <div
        id="analyticsBox"
        class="hidden mb-8 bg-white p-6 rounded-2xl shadow-sm border border-indigo-100 border-l-4 border-l-indigo-600"
      >
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-chart-line text-indigo-600"></i> Category
            Aggregation Analytics
          </h2>
          <button
            onclick="fetchAnalytics()"
            class="text-slate-400 hover:text-slate-600 text-sm"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div
          id="analyticsContent"
          class="grid grid-cols-1 md:grid-cols-3 gap-4"
        ></div>
      </div>

      <!-- Products Header & Grid -->
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-slate-800">Catalog Inventory</h2>
        <span
          id="productCountBadge"
          class="text-xs bg-slate-200 text-slate-700 px-3 py-1 rounded-full font-medium"
          >Loading items...</span
        >
      </div>

      <div
        id="productGrid"
        class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6"
      ></div>
    </main>

    <!-- Add Product Modal Form -->
    <div
      id="productModal"
      class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"
    >
      <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 relative">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-bold text-slate-800">
            <i class="fa-solid fa-circle-plus text-emerald-600"></i> Add New
            Product
          </h3>
          <button
            onclick="closeModal()"
            class="text-slate-400 hover:text-slate-600"
          >
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>
        <form
          id="addProductForm"
          onsubmit="submitProduct(event)"
          class="space-y-4"
        >
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1"
              >Product SKU</label
            >
            <input
              type="text"
              id="newSku"
              required
              placeholder="e.g., LAP-DEL-XPS"
              class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1"
              >Product Name</label
            >
            <input
              type="text"
              id="newName"
              required
              placeholder="e.g., Dell XPS 15"
              class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm"
            />
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1"
                >Category</label
              >
              <input
                type="text"
                id="newCategory"
                required
                placeholder="Electronics > Laptops"
                class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1"
                >Brand</label
              >
              <input
                type="text"
                id="newBrand"
                required
                placeholder="Dell"
                class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm"
              />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1"
                >Base Price ($)</label
              >
              <input
                type="number"
                step="0.01"
                id="newPrice"
                required
                placeholder="1499.00"
                class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1"
                >Rating (0-5)</label
              >
              <input
                type="number"
                step="0.1"
                id="newRating"
                required
                placeholder="4.8"
                class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm"
              />
            </div>
          </div>
          <button
            type="submit"
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-lg font-medium text-sm transition shadow-sm"
          >
            Save Product to Database
          </button>
        </form>
      </div>
    </div>

    <!-- Frontend Application Logic -->
    <script>
      const API_URL = "http://localhost:3000/api/products";
      const ANALYTICS_URL = "http://localhost:3000/api/analytics/categories";

      async function loadProducts() {
        const category = document.getElementById("categoryFilter").value;
        const sort = document.getElementById("sortFilter").value;

        let url = `${API_URL}?category=${category}&sort=${sort}`;

        try {
          const response = await fetch(url);
          const data = await response.json();
          displayProducts(data.products);
          document.getElementById("productCountBadge").innerText =
            `${data.totalProducts} Total Items`;
        } catch (error) {
          console.error("Error loading products:", error);
        }
      }

      function displayProducts(products) {
        const grid = document.getElementById("productGrid");
        grid.innerHTML = "";

        if (!products || products.length === 0) {
          grid.innerHTML =
            '<p class="text-slate-500 col-span-full text-center py-12">No matching products found.</p>';
          return;
        }

        products.forEach((p) => {
          grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 hover:shadow-md transition p-5 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <span class="text-[10px] uppercase tracking-wider font-bold px-2.5 py-1 rounded-full border bg-slate-100 text-slate-700">${p.brand || "General"}</span>
                                <span class="text-xs text-amber-600 font-semibold bg-amber-50 px-2 py-0.5 rounded flex items-center gap-1">
                                    <i class="fa-solid fa-star text-[10px]"></i> ${p.ratings ? p.ratings.average : "N/A"}
                                </span>
                            </div>
                            <h3 class="font-bold text-slate-800 text-base mb-1 truncate">${p.name}</h3>
                            <p class="text-xs text-slate-400 mb-4 truncate">${p.category}</p>
                        </div>
                        <div class="pt-4 border-t border-slate-100 flex justify-between items-center">
                            <div>
                                <span class="text-xs text-slate-400 block">Base Price</span>
                                <span class="text-lg font-extrabold text-slate-900">$${p.pricing.base_price.toFixed(2)}</span>
                            </div>
                            <span class="text-xs bg-emerald-50 text-emerald-700 font-medium px-2.5 py-1 rounded-lg">In Stock</span>
                        </div>
                    </div>
                `;
        });
      }

      async function searchProducts() {
        const keyword = document.getElementById("searchInput").value;
        if (!keyword) return loadProducts();

        try {
          const response = await fetch(
            `http://localhost:3000/api/products/search?q=${keyword}`,
          );
          const data = await response.json();
          displayProducts(data);
        } catch (error) {
          console.error("Search error:", error);
        }
      }

      // Modal Controls
      function openModal() {
        document.getElementById("productModal").classList.remove("hidden");
      }
      function closeModal() {
        document.getElementById("productModal").classList.add("hidden");
      }

      // Submit New Product via Form
      async function submitProduct(event) {
        event.preventDefault();
        const newProduct = {
          sku: document.getElementById("newSku").value,
          name: document.getElementById("newName").value,
          category: document.getElementById("newCategory").value,
          brand: document.getElementById("newBrand").value,
          pricing: {
            base_price: parseFloat(document.getElementById("newPrice").value),
            currency: "USD",
            discount: 0,
          },
          ratings: {
            average: parseFloat(document.getElementById("newRating").value),
            count: 1,
          },
        };

        try {
          const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newProduct),
          });
          if (response.ok) {
            closeModal();
            document.getElementById("addProductForm").reset();
            loadProducts();
            alert("Product successfully added to MongoDB!");
          } else {
            alert("Error adding product. SKU might already exist.");
          }
        } catch (err) {
          console.error(err);
        }
      }

      async function fetchAnalytics() {
        const box = document.getElementById("analyticsBox");
        const content = document.getElementById("analyticsContent");

        if (!box.classList.contains("hidden")) {
          box.classList.add("hidden");
          return;
        }

        try {
          const response = await fetch(ANALYTICS_URL);
          const analytics = await response.json();

          content.innerHTML = "";
          analytics.forEach((item) => {
            content.innerHTML += `
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <h4 class="font-bold text-indigo-600 text-sm mb-2 truncate">${item._id}</h4>
                            <div class="space-y-1 text-xs text-slate-600">
                                <p class="flex justify-between"><span>Total Products:</span> <strong class="text-slate-800">${item.totalProducts}</strong></p>
                                <p class="flex justify-between"><span>Average Price:</span> <strong class="text-slate-800">$${item.averagePrice.toFixed(2)}</strong></p>
                                <p class="flex justify-between"><span>Max Price:</span> <strong class="text-slate-800">$${item.maxPrice.toFixed(2)}</strong></p>
                            </div>
                        </div>
                    `;
          });

          box.classList.remove("hidden");
        } catch (error) {
          console.error("Analytics error:", error);
        }
      }

      loadProducts();
    </script>
  </body>
</html>
